<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you – VANTA/9</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <div class="ok-box" id="result"></div>
</main>

<div id="site-footer"></div>

<script src="site.js"></script>
<script>
  /* Shown after paying on Stripe (?paid=1) or after a demo order (?demo=1).
     The cart is emptied because the order is done.
     Note: a real shop confirms payments with a Stripe webhook, because
     anyone could type ?paid=1 into the address. For a learning shop this is fine. */
  const q = new URLSearchParams(location.search);
  const demo = q.get('demo') === '1';
  const paid = q.get('paid') === '1';

  if (demo || paid) {
    saveCart([]);
    $('#result').innerHTML =
      '<div class="big-emoji">' + (demo ? '🧪' : '🎉') + '</div>' +
      '<h1>' + (demo ? 'Demo order placed' : 'Thank you!') + '</h1>' +
      '<p>' + (demo
        ? 'This was a test: no payment was taken and nothing will be shipped. The checkout flow works.'
        : 'Your payment went through. A receipt is on its way to your email. VANTA/9 is a fictional brand, so nothing will be shipped.') + '</p>' +
      '<a class="btn btn-light" href="index.html">Back to the shop</a>';
  } else {
    $('#result').innerHTML =
      '<div class="big-emoji">🛍️</div><h1>Nothing to see here</h1><p>There is no order on this page.</p>' +
      '<a class="btn btn-light" href="index.html">Back to the shop</a>';
  }
</script>
</body>
</html>
